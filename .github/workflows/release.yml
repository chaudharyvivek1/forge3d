name: release

# Publishing is a tag push:
#
#   git tag v0.6.7 && git push origin v0.6.7
#
# The build is verified (twine check) before anything is uploaded, so a broken
# README or bad metadata fails here rather than on PyPI.
#
# Auth: PyPI **trusted publishing** (OIDC) — no long-lived token to leak. Set it
# up once at https://pypi.org/manage/account/publishing/ with:
#     owner: chaudharyvivek1   repo: forge3d
#     workflow: release.yml    environment: pypi
# If you would rather use an API token, add it as the repository secret
# PYPI_API_TOKEN and replace the `with:` block below with
#     password: ${{ secrets.PYPI_API_TOKEN }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check only; do not upload"
        type: boolean
        default: true

jobs:
  build:
    name: build and verify the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify metadata and that the README renders
        run: twine check dist/*

      - name: Install the wheel in a clean venv and smoke test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "
          import forge3d, forge3d.server, forge3d.geometry.surfaces
          print('version', forge3d.__version__)
          m = forge3d.geometry.surfaces.build_shape('torus_knot', {'p':2,'q':3}, resolution=24)
          print('built', len(m.faces), 'faces')
          "
          /tmp/smoke/bin/forge3d --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/forge3d
    permissions:
      id-token: write        # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        # No password: the action exchanges the OIDC token for a short-lived one.
